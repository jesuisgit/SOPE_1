<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz de Sistemas Operacionais</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Quiz de Sistemas Operacionais</h1>

    <div id="inicio">
      <label for="nome">Digite seu nome:</label>
      <input type="text" id="nome" />
      <button onclick="iniciarQuiz()">Iniciar Quiz</button>
    </div>

    <form id="quizForm" style="display:none;"></form>
    <button type="button" id="botaoCorrigir" onclick="corrigir()" style="display:none;">Corrigir</button>

    <div id="resultado"></div>
    <div id="ranking"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
