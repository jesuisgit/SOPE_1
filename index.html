<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz de Sistemas Operacionais</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div id="tela-inicial">
      <h1>Quiz de Sistemas Operacionais</h1>
      <button onclick="iniciarQuiz()">Iniciar Quiz</button>
    </div>

    <div id="quiz" style="display:none;">
      <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <div id="pergunta-container"></div>
      <div id="explicacao" class="explicacao"></div>
      <button id="proximoBtn" style="display:none;" onclick="proximaPergunta()">Próxima Pergunta</button>
    </div>

    <div id="resultado" style="display:none;"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
